[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamemaker-agent-tools"
version = "0.2.0"
description = "Lossless, agent-friendly tooling for GameMaker projects"
requires-python = ">=3.11"

[project.scripts]
gmtool = "gmtool.cli:main"

[project.optional-dependencies]
preview = ["Pillow>=10"]
animation = ["Pillow>=10", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gmtool.animation_harness" = ["static/*", "templates/*"]
